name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements/dev.lock
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
  docker-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker pull python:3.11-slim
      - run: python -m repofix run --repo examples/tinybug/repo --issue examples/tinybug/issue.md --verification examples/tinybug/verification --demo
        env:
          PYTHONPATH: src
      - run: python -m repofix batch --mode reference
        env:
          PYTHONPATH: src
      - run: python -m repofix batch --manifest benchmarks/real/manifest.json --mode reference
        env:
          PYTHONPATH: src
      - run: python scripts/structured_smoke.py
        env:
          PYTHONPATH: src
      - run: python scripts/resume_smoke.py
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-trace
          path: runs/
  ui-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
