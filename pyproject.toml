[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repofix-agent"
version = "0.2.0"
description = "An execution-feedback agent for Python issue repair"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
repofix = "repofix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repofix = ["static/*.html", "static/*.css", "static/*.js", "static/*.mjs"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks", "work", "runs", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
