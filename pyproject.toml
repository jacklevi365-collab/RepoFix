[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repofix-agent"
version = "0.1.0"
description = "An execution-feedback agent for Python issue repair"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
repofix = "repofix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
